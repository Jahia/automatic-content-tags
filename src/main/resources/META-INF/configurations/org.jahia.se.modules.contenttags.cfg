# default configuration - won't be overridden
# Automatic Content Tags - default configuration
#
# The module reaches its models through genai-connector. The provider, the model and the API key of
# each tier (lite, balanced, advanced, vision) are set in org.jahia.modules.genai.cfg, never here.
# Every call that sends an image, for the alternative text or the tags of an image, uses the tier
# vision, whose model must accept images.

# --- Tags ---

# genai-connector tier that generates the tags of a content from its text: lite | balanced | advanced.
# An image is tagged from its picture on the tier vision.
llm.tier=lite

# Property that receives the tags, and the mixin that declares it. The Content Editor dialog fills that
# field and activates the mixin; the editor saves. Leave llm.tag.mixin empty when the content type itself
# declares the property. A single-valued string property receives the tags joined with ", ".
llm.tag.property=j:tagList
llm.tag.mixin=jmix:tagged

# Style guidance only. The number of tags (from the dialog) and the target tag language are
# injected by the module and must NOT be hardcoded here, or they will conflict with the request.
llm.user.prompt=Respond ONLY with a JSON array of concise single- or two-word strings, without markdown, explanations or duplicates.

# Maximum number of tags a request may generate (hard-capped at 50). Users cannot exceed this.
llm.tag.count.max=20

# Default number of tags when the dialog does not specify one (clamped to llm.tag.count.max).
llm.tag.count.default=5

# Maximum tokens the model may generate for the tags
llm.max.tokens=1024

# Maximum number of characters of content text sent to the model
llm.max.source.chars=6000

# Optional sampling temperature, for tags and alternative text. Leave empty to use the provider
# default (several recent models reject non-default temperatures).
llm.temperature=

# Largest image rendition sent to the model, in bytes (default 5 MB), for the alternative text and
# the tags of an image. A larger original is replaced by the thumbnail Jahia generated for it.
image.max.bytes=5242880

# --- Alternative text of images (GraphQL mutation generateImageAltText) ---

# Generate the alternative text of each image right after it is uploaded, in every language of its
# site, as the uploader. An existing text is never replaced. Set to false to generate it only through
# the GraphQL mutation.
alt.generate.on.upload=true

# Property that receives the alternative text, and the mixin added to the image before it is written.
# The property must be a single-valued string; an i18n one gets one text per language. Leave alt.mixin
# empty when the image types already declare the property.
alt.property=jahia_alt
alt.mixin=jmix:jahiaAlt

# Most characters of one alternative text (20 to 1000)
alt.max.length=150

# Most images that one call sends to the model (1 to 500). A call that reaches it reports
# truncated=true; call again to continue, the images done are skipped.
alt.max.images=20

# Maximum tokens the model may generate for one alternative text
alt.max.tokens=300

# Optional instructions that replace the built-in ones. The language and the maximum length are
# injected by the module on every request.
#alt.prompt=
