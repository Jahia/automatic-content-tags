# default configuration - won't be overridden
# Automatic Content Tags - default configuration
#
# Since the migration to the genai-connector module, the LLM provider, API key and
# model are configured CENTRALLY in org.jahia.modules.genai.cfg (genai-connector).
# This file only keeps the module's own knobs (prompt and sizing).

# Prompt sent before the extracted content text. The target tag language and the text
# are appended automatically.
llm.user.prompt=Generate 5 tags for the following text. Respond ONLY with a JSON array of strings, without markdown or explanations.

# Maximum tokens the model may generate
llm.max.tokens=1024

# Maximum number of characters of content text sent to the provider
llm.max.source.chars=6000

# Optional sampling temperature. Leave empty to use the provider default
# (recent Anthropic and OpenAI models reject non-default temperatures).
llm.temperature=
