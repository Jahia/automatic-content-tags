# default configuration - won't be overridden
# Automatic Content Tags - default configuration
#
# The module reaches its models through genai-connector. The provider, the model and the API key of
# each tier (lite, balanced, advanced) are set in org.jahia.modules.genai.cfg, never here.

# --- Tags ---

# genai-connector tier that generates the tags: lite | balanced | advanced
llm.tier=lite

# Style guidance only. The number of tags (from the dialog) and the target tag language are
# injected by the module and must NOT be hardcoded here, or they will conflict with the request.
llm.user.prompt=Respond ONLY with a JSON array of concise single- or two-word strings, without markdown, explanations or duplicates.

# Maximum number of tags a request may generate (hard-capped at 50). Users cannot exceed this.
llm.tag.count.max=20

# Default number of tags when the dialog does not specify one (clamped to llm.tag.count.max).
llm.tag.count.default=5

# Maximum tokens the model may generate for the tags
llm.max.tokens=1024

# Maximum number of characters of content text sent to the model
llm.max.source.chars=6000

# Optional sampling temperature, for tags and alternative text. Leave empty to use the provider
# default (several recent models reject non-default temperatures).
llm.temperature=

# --- Alternative text of images (GraphQL mutation generateImageAltText) ---

# genai-connector tier that writes the alternative text. Its model must accept images.
alt.tier=lite

# Most characters of one alternative text (20 to 1000)
alt.max.length=150

# Most images that one call sends to the model (1 to 500). A call that reaches it reports
# truncated=true; call again to continue, the images done are skipped.
alt.max.images=20

# Largest image rendition sent to the model, in bytes (default 5 MB). A larger original is replaced
# by the thumbnail Jahia generated for it.
alt.max.image.bytes=5242880

# Maximum tokens the model may generate for one alternative text
alt.max.tokens=300

# Optional instructions that replace the built-in ones. The language and the maximum length are
# injected by the module on every request.
#alt.prompt=
